name: Test matHELICS
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  ci-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022,macos-15,ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3.0.1
        with:
          release: R2025a
      - name: Set up MEX
        uses: matlab-actions/run-command@v3
        with:
          command: mex -setup
      - name: Build matHELICS
        uses: matlab-actions/run-command@v3
        with:
          command: buildHelicsInterface('helics',true)
      - name: Check HELICS version
        uses: matlab-actions/run-command@v3
        with:
          command: "addpath('helics'); v = helics.helicsGetVersion(); s = fileread('buildHelicsInterface.m'); t = regexp(s, 'HelicsVersion=''([^'']+)''', 'tokens', 'once'); assert(contains(v, t{1}), ['HELICS version mismatch: built ' v ' expected ' t{1}])"
      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: mv matHELICS.zip matHELICS-${{ matrix.os }}.zip
      - name: Rename artifact
        if: runner.os != 'Windows'
        run: mv matHELICS.tar.gz matHELICS-${{ matrix.os }}.tar.gz
      - name: store package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-matHELICS
          path: matHELICS-${{ matrix.os }}.*
      - name: run tests
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'),addpath('helics'),runAllTests

  release:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: ci-test
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with: # no name specified, so all artifacts will be downloaded
          path: ./artifacts
          merge-multiple: true
      - name: List files in artifacts
        run: ls ./artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: Release for [HELICS ${{ github.ref_name }}](https://github.com/GMLC-TDC/HELICS/releases/tag/${{ github.ref_name }})
          files: ./artifacts/matHELICS-*
